services:
  db:
    image: postgres:15-alpine
    container_name: wedding_db_dev
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wedding_app}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - wedding_dev_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wedding_backend_dev
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-wedding_app}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - PYTHONPATH=/app
    ports:
      - "8000:8000"    
    volumes:
      - ./backend:/app
    command: /bin/sh -c "/entrypoint.sh uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      - db
    networks:
      - wedding_dev_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wedding_frontend_dev
    restart: "no"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - wedding_dev_network

networks:
  wedding_dev_network:
    driver: bridge

volumes:
  postgres_dev_data: